<!doctype html>
<html lang="es" data-theme="auto">
<head>
	<meta charset="utf-8">
	<title>Duplicados</title>
	<link rel="icon" href="../icons/icon.svg">
	<link rel="stylesheet" href="../lib/theme.css">
	<link rel="stylesheet" href="popup.css">
</head>
<body>
	<header class="head">
		<strong>Duplicados</strong>
		<span id="count" class="count"></span>
		<span id="countDoubt" class="count doubt" title="Casos dudosos"></span>
		<span class="spacer"></span>
		<button id="closeAll" class="icon" disabled title="Cerrar duplicados" aria-label="Cerrar duplicados">
			<svg viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/><path d="M12 12l5 5M17 12l-5 5"/></svg>
		</button>
		<button id="undo" class="icon" hidden title="Deshacer: reabrir lo último cerrado" aria-label="Deshacer">
			<svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
		</button>
		<span class="sep"></span>
		<button id="openSettings" class="icon" title="Ajustes" aria-label="Ajustes">
			<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
		</button>
		<button id="openWindow" class="icon" title="Abrir en ventana propia (tamaño libre)" aria-label="Abrir en ventana propia">
			<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
		</button>
		<button id="openTab" class="icon" title="Lista detallada en una pestaña (por qué se agrupan, ayuda)" aria-label="Lista en pestaña">
			<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
		</button>
	</header>

	<div id="note" class="note" hidden></div>
	<div id="list" class="list" tabindex="-1"></div>

	<div id="grip" class="grip" title="Arrastra: barra = alto, esquina = alto y ancho. Doble clic: tamaño normal. Firefox no deja que esta ventanita pase de 800 × 600; para más, usa la ventana grande." aria-hidden="true"></div>

	<script src="../lib/normalize.js"></script>
	<script src="../lib/settings.js"></script>
	<script src="../lib/theme.js"></script>
	<script src="popup.js"></script>
</body>
</html>
